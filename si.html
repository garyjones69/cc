<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Invaders HD</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #020817;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
}

.game {
    width: min(100%, 900px);
    padding: 10px;
}

header {
    display: flex;
    justify-content: space-around;
    padding: 15px 5px;
    background: #07172b;
    border: 2px solid #087fbd;
    font-weight: bold;
    font-size: 15px;
}

header span { color: #42f5d7; }

canvas {
    display: block;
    width: 100%;
    background: #020817;
    border-left: 2px solid #087fbd;
    border-right: 2px solid #087fbd;
    touch-action: none;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    background: #07172b;
    border: 2px solid #087fbd;
}

button {
    padding: 14px 22px;
    background: #17365c;
    color: white;
    border: 2px solid #438dcc;
    border-radius: 10px;
    font-size: 20px;
    font-weight: bold;
    touch-action: none;
}

button.fire {
    background: #bd1828;
    border-color: #ff6574;
    min-width: 110px;
}

.instructions {
    text-align: center;
    color: #8daac5;
    font-size: 12px;
    padding: 10px;
}

@media (min-width: 700px) {
    .controls { display: none; }
}
</style>
</head>

<body>
<div class="game">

<header>
    <div>SCORE: <span id="score">00000</span></div>
    <div>BEST: <span id="best">00000</span></div>
    <div>LIVES: <span id="lives">3</span></div>
    <div>LEVEL: <span id="level">1</span></div>
</header>

<canvas id="game" width="800" height="600"></canvas>

<div class="controls">
    <button id="left">◀</button>
    <button id="fire" class="fire">🔥 FIRE</button>
    <button id="right">▶</button>
    <button id="pause">Ⅱ</button>
</div>

<div class="instructions">
    Arrow keys / A and D to move · SPACE to fire · P to pause
</div>

</div>

<script>

// Each sprite is 256 x 192 pixels.

const spriteImage = new Image();

spriteImage.src =
    "data:image/svg+xml;charset=utf-8," +
    encodeURIComponent(svg);


// =====================================================
// GAME ENGINE
// =====================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = 800;
const HEIGHT = 600;

let score, lives, level, best;
let player, aliens, shots, bombs, explosions;
let keys = {};
let running = false;
let paused = false;
let gameOver = false;
let lastTime = 0;
let elapsed = 0;
let alienDirection = 1;
let alienTimer = 0;

best = Number(localStorage.getItem("invadersBest") || 0);

function newGame() {

    score = 0;
    lives = 3;
    level = 1;

    player = {
        x: 400,
        y: 550,
        speed: 6,
        cooldown: 0,
        invulnerable: 0
    };

    shots = [];
    bombs = [];
    explosions = [];

    paused = false;
    gameOver = false;
    running = true;

    createAliens();
    updateHUD();
}

function createAliens() {

    aliens = [];

    for (let row = 0; row < 4; row++) {

        for (let col = 0; col < 9; col++) {

            aliens.push({
                x: 110 + col * 72,
                y: 90 + row * 65,
                type: row,
                alive: true
            });
        }
    }

    alienDirection = 1;
}

function updateHUD() {

    document.getElementById("score").textContent =
        String(score).padStart(5, "0");

    document.getElementById("best").textContent =
        String(best).padStart(5, "0");

    document.getElementById("lives").textContent = lives;
    document.getElementById("level").textContent = level;
}


// =====================================================
// DRAW SPRITES FROM THE SHEET
// =====================================================

function drawSprite(sx, sy, sw, sh, x, y, w, h) {

    if (!spriteImage.complete) return;

    ctx.drawImage(
        spriteImage,
        sx, sy, sw, sh,
        x, y, w, h
    );
}

function drawAlien(a) {

    const frame = Math.floor(elapsed / 250) % 2;

    const sx = frame * 256;
    const sy = a.type * 192;

    drawSprite(
        sx, sy,
        256, 192,
        a.x - 28, a.y - 21,
        56, 42
    );
}

function drawPlayer() {

    const frame = Math.floor(elapsed / 150) % 2;

    drawSprite(
        frame * 256, 768,
        256, 192,
        player.x - 35, player.y - 27,
        70, 54
    );
}

function drawExplosion(e) {

    const frame = Math.min(3, Math.floor(e.age / 90));

    drawSprite(
        frame * 256,
        960,
        256, 192,
        e.x - 35, e.y - 35,
        70, 70
    );
}


// =====================================================
// GAME ACTIONS
// =====================================================

function fire() {

    if (gameOver || paused) return;

    if (player.cooldown <= 0) {

        shots.push({
            x: player.x,
            y: player.y - 30
        });

        player.cooldown = 300;
    }
}

function createExplosion(x, y) {

    explosions.push({
        x, y,
        age: 0
    });
}

function finishGame() {

    gameOver = true;
    running = false;

    if (score > best) {
        best = score;
        localStorage.setItem("invadersBest", best);
    }

    updateHUD();
}


// =====================================================
// UPDATE
// =====================================================

function update(dt) {

    if (paused || gameOver) return;

    elapsed += dt;

    player.cooldown -= dt;
    player.invulnerable =
        Math.max(0, player.invulnerable - dt);

    // Player movement

    if (keys.ArrowLeft || keys.a || keys.A) {
        player.x -= player.speed;
    }

    if (keys.ArrowRight || keys.d || keys.D) {
        player.x += player.speed;
    }

    player.x = Math.max(35, Math.min(765, player.x));

    // Firing

    if (keys[" "]) fire();

    // Player shots

    shots.forEach(s => s.y -= 9);
    shots = shots.filter(s => s.y > 0);

    // Alien movement

    const alive = aliens.filter(a => a.alive);

    const speed = 0.6 + (36 - alive.length) * 0.025;

    aliens.forEach(a => {
        if (a.alive) {
            a.x += alienDirection * speed;
        }
    });

    const left = Math.min(...alive.map(a => a.x));
    const right = Math.max(...alive.map(a => a.x));

    if (right > 770 || left < 30) {

        alienDirection *= -1;

        aliens.forEach(a => {
            if (a.alive) a.y += 18;
        });
    }

    // Alien bombs

    alienTimer += dt;

    if (alienTimer > 1100 && alive.length) {

        alienTimer = 0;

        const shooter =
            alive[Math.floor(Math.random() * alive.length)];

        bombs.push({
            x: shooter.x,
            y: shooter.y + 20
        });
    }

    bombs.forEach(b => b.y += 4);
    bombs = bombs.filter(b => b.y < HEIGHT);

    // Shot collision

    shots.forEach(s => {

        aliens.forEach(a => {

            if (!a.alive) return;

            if (
                Math.abs(s.x - a.x) < 27 &&
                Math.abs(s.y - a.y) < 22
            ) {

                a.alive = false;
                s.y = -100;

                score += [40, 30, 20, 10][a.type];

                createExplosion(a.x, a.y);
            }
        });
    });

    // Player collision

    bombs.forEach(b => {

        if (
            Math.abs(b.x - player.x) < 28 &&
            Math.abs(b.y - player.y) < 25 &&
            player.invulnerable <= 0
        ) {

            b.y = 1000;

            lives--;

            player.invulnerable = 1600;

            createExplosion(player.x, player.y);

            if (lives <= 0) finishGame();
        }
    });

    // Explosion animation

    explosions.forEach(e => e.age += dt);

    explosions = explosions.filter(e => e.age < 360);

    // Next level

    if (aliens.every(a => !a.alive)) {

        level++;

        createAliens();
        bombs = [];
    }

    // Aliens reach player

    if (aliens.some(a => a.alive && a.y > player.y - 40)) {
        finishGame();
    }

    updateHUD();
}


// =====================================================
// RENDER
// =====================================================

function draw() {

    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    // Stars

    for (let i = 0; i < 100; i++) {

        const x = (i * 137) % WIDTH;
        const y = (i * 83) % HEIGHT;

        ctx.fillStyle = i % 5 === 0 ? "#ffffff" : "#254b75";

        ctx.fillRect(x, y, 2, 2);
    }

    // Planetary horizon

    const gradient = ctx.createLinearGradient(0, 470, 0, 600);

    gradient.addColorStop(0, "rgba(0,70,180,0)");
    gradient.addColorStop(1, "rgba(0,120,255,.3)");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 470, WIDTH, 130);

    // Aliens

    aliens.forEach(a => {
        if (a.alive) drawAlien(a);
    });

    // Player shots

    ctx.shadowColor = "#00eaff";
    ctx.shadowBlur = 15;
    ctx.fillStyle = "#8fffff";

    shots.forEach(s => {
        ctx.fillRect(s.x - 3, s.y - 12, 6, 20);
    });

    ctx.shadowBlur = 0;

    // Alien bombs

    ctx.fillStyle = "#ff593d";

    bombs.forEach(b => {
        ctx.fillRect(b.x - 3, b.y, 6, 15);
    });

    // Player

    if (
        !player.invulnerable ||
        Math.floor(elapsed / 100) % 2 === 0
    ) {
        drawPlayer();
    }

    // Explosions

    explosions.forEach(drawExplosion);

    // Overlay

    if (paused || gameOver) {

        ctx.fillStyle = "rgba(0,0,0,.75)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 48px Arial";

        ctx.fillText(
            gameOver ? "GAME OVER" : "PAUSED",
            400, 275
        );

        ctx.font = "22px Arial";

        ctx.fillText(
            gameOver ? "Press ENTER to restart" : "Press P to resume",
            400, 320
        );
    }
}


// =====================================================
// MAIN LOOP
// =====================================================

function loop(time) {

    const dt = Math.min(40, time - (lastTime || time));

    lastTime = time;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}


// =====================================================
// KEYBOARD
// =====================================================

window.addEventListener("keydown", e => {

    keys[e.key] = true;

    if (
        [" ", "ArrowLeft", "ArrowRight"].includes(e.key)
    ) {
        e.preventDefault();
    }

    if (e.key.toLowerCase() === "p" && !gameOver) {
        paused = !paused;
    }

    if (e.key === "Enter" && gameOver) {
        newGame();
    }
});

window.addEventListener("keyup", e => {
    keys[e.key] = false;
});


// =====================================================
// MOBILE CONTROLS
// =====================================================

function holdButton(id, key) {

    const button = document.getElementById(id);

    button.addEventListener("pointerdown", e => {
        e.preventDefault();
        keys[key] = true;
        button.setPointerCapture(e.pointerId);
    });

    ["pointerup", "pointercancel", "lostpointercapture"].forEach(event => {
        button.addEventListener(event, () => {
            keys[key] = false;
        });
    });
}

holdButton("left", "ArrowLeft");
holdButton("right", "ArrowRight");

document.getElementById("fire").addEventListener(
    "pointerdown",
    e => {
        e.preventDefault();
        fire();
    }
);

document.getElementById("pause").onclick = () => {
    if (!gameOver) paused = !paused;
};


// =====================================================
// START
// =====================================================

newGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
