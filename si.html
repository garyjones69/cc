<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Space Invaders HD</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020617;
    color: white;
    font-family: Arial, sans-serif;
    touch-action: none;
}

.game {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 5px;
    gap: 5px;
}

header {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 10px;
    background: #101b35;
    border: 1px solid #263b65;
    border-radius: 8px;
    font-size: clamp(12px, 2.5vw, 18px);
}

.title {
    color: #50eaff;
    font-weight: bold;
    letter-spacing: 2px;
}

.stats {
    display: flex;
    gap: 12px;
}

.stat span {
    color: #65f5a5;
    font-weight: bold;
}

.gamearea {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #020617;
}

canvas {
    display: block;
    width: 800px;
    height: 600px;
    max-width: none;
    max-height: none;
    border: 1px solid #24375d;
    background: #020617;
    border-radius: 5px;
}

.controls {
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 5px 4px max(5px, env(safe-area-inset-bottom));
}

button {
    border: 1px solid #42618e;
    border-radius: 12px;
    background: linear-gradient(#1c3157, #101c36);
    color: white;
    font-weight: bold;
    font-size: clamp(14px, 3vw, 20px);
    min-width: 60px;
    height: 58px;
    padding: 0 15px;
    touch-action: none;
    user-select: none;
}

button:active {
    background: #315b91;
    transform: scale(.96);
}

button.fire {
    background: linear-gradient(#a52a35, #64121d);
    border-color: #ff6875;
    min-width: 105px;
}

button.pause {
    min-width: 55px;
}

button.sound {
    min-width: 55px;
    height: 38px;
    font-size: 14px;
}

.instructions {
    flex-shrink: 0;
    text-align: center;
    font-size: 11px;
    color: #8198bd;
    padding-bottom: 2px;
}

@media (orientation: landscape) and (max-height: 550px) {
    .game {
        gap: 3px;
        padding: 3px;
    }

    header {
        padding: 2px 8px;
    }

    button {
        height: 43px;
        min-width: 55px;
    }

    button.sound {
        height: 32px;
    }

    .controls {
        padding: 2px;
        gap: 7px;
    }

    .instructions {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div class="game">

<header>
    <div class="title">SPACE INVADERS</div>

    <div class="stats">
        <div class="stat">SCORE <span id="score">0</span></div>
        <div class="stat">LIVES <span id="lives">3</span></div>
        <div class="stat">LEVEL <span id="level">1</span></div>
    </div>

    <button class="sound" id="soundButton">🔊 SOUND</button>
</header>

<div class="gamearea">
    <canvas id="game" width="800" height="600"></canvas>
</div>

<div class="controls">
    <button id="left">◀ LEFT</button>
    <button class="fire" id="fire">🔥 FIRE</button>
    <button id="right">RIGHT ▶</button>
    <button class="pause" id="pause">Ⅱ</button>
</div>

<div class="instructions">
    KEYBOARD: ← → or A/D to move · SPACE to fire · P to pause
</div>

</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 800;
const H = 600;

const scoreDisplay = document.getElementById("score");
const livesDisplay = document.getElementById("lives");
const levelDisplay = document.getElementById("level");

let score = 0;
let lives = 3;
let level = 1;

let running = false;
let paused = false;
let gameOver = false;

let lastTime = 0;
let alienDirection = 1;
let alienMoveTimer = 0;
let alienMoveInterval = 0.55;
let alienFrame = 0;
let alienFrameTimer = 0;
let backgroundStars = [];

const keys = {};
const bullets = [];
const alienBullets = [];
const explosions = [];

let aliens = [];

const player = {
    x: 400,
    y: 535,
    width: 54,
    height: 38,
    speed: 390,
    cooldown: 0,
    alive: true
};

/* --------------------------------------------------
   SOUND SYSTEM
   All sounds are synthesised using the Web Audio API.
-------------------------------------------------- */

let audioContext = null;
let masterGain = null;
let soundEnabled = true;
let musicTimer = null;
let musicStep = 0;

function initAudio() {
    if (!audioContext) {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return;

        audioContext = new AudioContextClass();

        masterGain = audioContext.createGain();
        masterGain.gain.value = 0.22;
        masterGain.connect(audioContext.destination);
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    if (soundEnabled) startMusic();
}

function tone(frequency, duration, type = "square", volume = 0.3, slide = 0) {
    if (!soundEnabled || !audioContext || !masterGain) return;

    const now = audioContext.currentTime;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, now);

    if (slide !== 0) {
        oscillator.frequency.exponentialRampToValueAtTime(
            Math.max(1, frequency + slide),
            now + duration
        );
    }

    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    oscillator.connect(gain);
    gain.connect(masterGain);

    oscillator.start(now);
    oscillator.stop(now + duration);
}

function noise(duration = 0.3, volume = 0.25) {
    if (!soundEnabled || !audioContext || !masterGain) return;

    const length = Math.floor(audioContext.sampleRate * duration);
    const buffer = audioContext.createBuffer(
        1, length, audioContext.sampleRate
    );

    const data = buffer.getChannelData(0);

    for (let i = 0; i < length; i++) {
        data[i] = Math.random() * 2 - 1;
    }

    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();

    source.buffer = buffer;
    gain.gain.setValueAtTime(volume, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );

    source.connect(gain);
    gain.connect(masterGain);
    source.start();
}

function soundShoot() {
    tone(850, 0.12, "sawtooth", 0.15, -650);
}

function soundAlienExplosion() {
    noise(0.18, 0.24);
    tone(180, 0.22, "square", 0.18, -130);
}

function soundPlayerExplosion() {
    noise(0.65, 0.35);
    tone(150, 0.6, "sawtooth", 0.3, -140);
}

function soundEnemyFire() {
    tone(260, 0.2, "square", 0.1, -170);
}

function soundLevelUp() {
    tone(523, 0.15, "square", 0.2);
    setTimeout(() => tone(659, 0.15, "square", 0.2), 130);
    setTimeout(() => tone(784, 0.2, "square", 0.2), 260);
    setTimeout(() => tone(1046, 0.35, "square", 0.2), 400);
}

function soundGameOver() {
    tone(392, 0.3, "square", 0.2, -100);
    setTimeout(() => tone(330, 0.3, "square", 0.2, -100), 300);
    setTimeout(() => tone(262, 0.7, "square", 0.2, -180), 600);
}

function soundAlienStep() {
    const notes = [95, 80, 70, 85];
    tone(notes[alienFrame % notes.length], 0.08, "square", 0.035);
}

function startMusic() {
    if (musicTimer || !soundEnabled) return;

    const notes = [110, 110, 146.83, 110, 164.81, 146.83, 110, 164.81];

    musicTimer = setInterval(() => {
        if (!running || paused || gameOver || !soundEnabled) return;

        tone(notes[musicStep % notes.length], 0.12, "square", 0.035);
        musicStep++;
    }, 230);
}

function stopMusic() {
    if (musicTimer) {
        clearInterval(musicTimer);
        musicTimer = null;
    }
}

document.getElementById("soundButton").addEventListener("click", () => {
    soundEnabled = !soundEnabled;

    document.getElementById("soundButton").textContent =
        soundEnabled ? "🔊 SOUND" : "🔇 MUTED";

    if (soundEnabled) {
        initAudio();
    } else {
        stopMusic();
    }
});

/* --------------------------------------------------
   SPRITE SHEET
   An embedded SVG sprite sheet - no external files.
-------------------------------------------------- */

const spriteSVG = `
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1152" viewBox="0 0 1024 1152">

<defs>
    <g id="alienGreen" fill="#50ff8a">
        <path d="M32 20h24v12H44v12H32V32H20v12H8V32H0V20h12V8h12v12z"
              transform="translate(20 20) scale(3)"/>
        <rect x="80" y="45" width="20" height="20" fill="#020617"/>
        <rect x="125" y="45" width="20" height="20" fill="#020617"/>
    </g>

    <g id="alienGold" fill="#ffe45c">
        <path d="M20 0h40v20h20v20h20v20H0V40h20V20z"/>
        <rect x="20" y="35" width="15" height="15" fill="#020617"/>
        <rect x="65" y="35" width="15" height="15" fill="#020617"/>
        <path d="M0 65h20v20H0zm80 0h20v20H80z"/>
    </g>

    <g id="alienPink" fill="#ff65bd">
        <path d="M10 0h80v20h10v40H90v20H10V60H0V20h10z"/>
        <rect x="25" y="30" width="15" height="18" fill="#020617"/>
        <rect x="60" y="30" width="15" height="18" fill="#020617"/>
        <path d="M10 70h20v20H10zm60 0h20v20H70z"/>
    </g>

    <g id="alienCyan" fill="#57eaff">
        <path d="M0 30h20V10h60v20h20v40H80v20H20V70H0z"/>
        <rect x="25" y="35" width="15" height="18" fill="#020617"/>
        <rect x="60" y="35" width="15" height="18" fill="#020617"/>
        <path d="M35 55h30v10H35z"/>
    </g>

    <g id="ship" fill="#56f3ff">
        <path d="M50 0L70 35h25v15H75v30H25V50H5V35h25z"/>
        <rect x="40" y="25" width="20" height="25" fill="#ffffff"/>
        <rect x="0" y="65" width="100" height="12" fill="#36a9ff"/>
    </g>
</defs>

<!-- Each alien type has two animation frames -->

<use href="#alienGreen" x="35" y="25" transform="translate(35 25)"/>
<use href="#alienGreen" x="291" y="25" transform="translate(291 25) scale(1 .9)"/>

<use href="#alienGold" x="35" y="220" transform="translate(35 220)"/>
<use href="#alienGold" x="291" y="220" transform="translate(291 220) scale(1 .9)"/>

<use href="#alienPink" x="35" y="410" transform="translate(35 410)"/>
<use href="#alienPink" x="291" y="410" transform="translate(291 410) scale(1 .9)"/>

<use href="#alienCyan" x="35" y="605" transform="translate(35 605)"/>
<use href="#alienCyan" x="291" y="605" transform="translate(291 605) scale(1 .9)"/>

<use href="#ship" x="35" y="800" transform="translate(35 800)"/>
<use href="#ship" x="291" y="800" transform="translate(291 800) scale(1 .9)"/>

<!-- Explosion frames -->
<g fill="#ffed66">
    <circle cx="128" cy="1050" r="35"/>
    <circle cx="384" cy="1050" r="28"/>
    <circle cx="640" cy="1050" r="20"/>
    <circle cx="896" cy="1050" r="12"/>
</g>
</svg>
`;

const spriteImage = new Image();

spriteImage.src =
    "data:image/svg+xml;charset=utf-8," +
    encodeURIComponent(spriteSVG);

/* --------------------------------------------------
   BACKGROUND
-------------------------------------------------- */

for (let i = 0; i < 110; i++) {
    backgroundStars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 22 + 8,
        alpha: Math.random() * 0.7 + 0.2
    });
}

function drawBackground(dt) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(0, 0, W, H);

    for (const star of backgroundStars) {
        star.y += star.speed * dt;

        if (star.y > H) {
            star.y = 0;
            star.x = Math.random() * W;
        }

        ctx.globalAlpha = star.alpha;
        ctx.fillStyle = "#b8d9ff";
        ctx.fillRect(star.x, star.y, star.size, star.size);
    }

    ctx.globalAlpha = 1;

    ctx.fillStyle = "rgba(40,100,180,0.08)";
    ctx.fillRect(0, 0, W, H);
}

/* --------------------------------------------------
   GAME SETUP
-------------------------------------------------- */

function createAliens() {
    aliens = [];

    const columns = 9;
    const rows = 4;

    for (let row = 0; row < rows; row++) {
        for (let col = 0; col < columns; col++) {
            aliens.push({
                x: 105 + col * 65,
                y: 95 + row * 60,
                width: 43,
                height: 34,
                type: row,
                alive: true
            });
        }
    }

    alienDirection = 1;
    alienMoveTimer = 0;
    alienMoveInterval = Math.max(0.13, 0.55 - (level - 1) * 0.045);
}

function newGame() {
    score = 0;
    lives = 3;
    level = 1;

    bullets.length = 0;
    alienBullets.length = 0;
    explosions.length = 0;

    player.x = 400;
    player.alive = true;
    player.cooldown = 0;

    gameOver = false;
    paused = false;
    running = true;

    createAliens();
    updateStats();
    initAudio();
}

function updateStats() {
    scoreDisplay.textContent = score;
    livesDisplay.textContent = lives;
    levelDisplay.textContent = level;
}

/* --------------------------------------------------
   DRAWING
-------------------------------------------------- */

function drawSprite(sx, sy, sw, sh, x, y, w, h) {
    if (!spriteImage.complete || spriteImage.naturalWidth === 0) return;

    ctx.drawImage(
        spriteImage,
        sx, sy, sw, sh,
        x, y, w, h
    );
}

function drawAliens() {
    for (const alien of aliens) {
        if (!alien.alive) continue;

        const frame = alienFrame % 2;
        const sx = frame * 256;
        const sy = alien.type * 192;

        drawSprite(
            sx, sy, 256, 192,
            alien.x, alien.y,
            alien.width, alien.height
        );
    }
}

function drawPlayer() {
    if (!player.alive) return;

    drawSprite(
        0, 768, 256, 192,
        player.x - 27, player.y - 18,
        player.width, player.height
    );
}

function drawBullets() {
    ctx.fillStyle = "#7affff";

    for (const bullet of bullets) {
        ctx.shadowColor = "#00ffff";
        ctx.shadowBlur = 12;
        ctx.fillRect(bullet.x - 2, bullet.y, 4, 15);
    }

    ctx.shadowBlur = 0;

    ctx.fillStyle = "#ff6b6b";

    for (const bullet of alienBullets) {
        ctx.fillRect(bullet.x - 3, bullet.y, 6, 13);
    }
}

function drawExplosions() {
    for (const explosion of explosions) {
        const frame = Math.min(
            3,
            Math.floor(explosion.age / 0.09)
        );

        const sx = frame * 256;

        ctx.globalAlpha = Math.max(0, 1 - explosion.age / 0.36);

        drawSprite(
            sx, 960, 256, 192,
            explosion.x - 25,
            explosion.y - 25,
            50, 50
        );
    }

    ctx.globalAlpha = 1;
}

function drawOverlay(title, subtitle) {
    ctx.fillStyle = "rgba(0,0,0,0.72)";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";

    ctx.shadowColor = "#00cfff";
    ctx.shadowBlur = 20;

    ctx.fillStyle = "#60eaff";
    ctx.font = "bold 55px Arial";
    ctx.fillText(title, W / 2, 260);

    ctx.shadowBlur = 0;

    ctx.fillStyle = "#ffffff";
    ctx.font = "22px Arial";
    ctx.fillText(subtitle, W / 2, 315);

    ctx.font = "17px Arial";
    ctx.fillStyle = "#a5c7ff";
    ctx.fillText("Press ENTER or tap FIRE to continue", W / 2, 365);
}

function draw() {
    drawBackground(0);
    drawAliens();
    drawPlayer();
    drawBullets();
    drawExplosions();

    if (!running && !gameOver) {
        drawOverlay("SPACE INVADERS", "Defend Earth from the alien invasion!");
    }

    if (paused && !gameOver) {
        drawOverlay("PAUSED", "Take a breather, pilot!");
    }

    if (gameOver) {
        drawOverlay("GAME OVER", "Final score: " + score);
    }
}

/* --------------------------------------------------
   COLLISIONS AND EXPLOSIONS
-------------------------------------------------- */

function addExplosion(x, y) {
    explosions.push({
        x,
        y,
        age: 0
    });
}

function collision(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function hitAlien(alien) {
    alien.alive = false;
    score += (4 - alien.type) * 10;

    addExplosion(alien.x + alien.width / 2, alien.y + alien.height / 2);
    soundAlienExplosion();

    updateStats();

    if (aliens.every(a => !a.alive)) {
        level++;
        soundLevelUp();
        bullets.length = 0;
        alienBullets.length = 0;
        createAliens();
        updateStats();
    }
}

/* --------------------------------------------------
   GAME UPDATE
-------------------------------------------------- */

function update(dt) {
    if (!running || paused || gameOver) return;

    if (keys["ArrowLeft"] || keys["a"] || keys["A"]) {
        player.x -= player.speed * dt;
    }

    if (keys["ArrowRight"] || keys["d"] || keys["D"]) {
        player.x += player.speed * dt;
    }

    player.x = Math.max(30, Math.min(W - 30, player.x));

    player.cooldown -= dt;

    if ((keys[" "] || keys["Space"]) && player.cooldown <= 0) {
        bullets.push({
            x: player.x,
            y: player.y - 20,
            width: 4,
            height: 15
        });

        player.cooldown = 0.28;
        soundShoot();
    }

    /* Move player bullets */

    for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        bullet.y -= 550 * dt;

        if (bullet.y < -20) {
            bullets.splice(i, 1);
            continue;
        }

        for (const alien of aliens) {
            if (!alien.alive) continue;

            if (collision(bullet, alien)) {
                hitAlien(alien);
                bullets.splice(i, 1);
                break;
            }
        }
    }

    /* Move alien formation */

    alienMoveTimer += dt;
    alienFrameTimer += dt;

    if (alienFrameTimer > 0.25) {
        alienFrame = 1 - alienFrame;
        alienFrameTimer = 0;
    }

    if (alienMoveTimer >= alienMoveInterval) {
        alienMoveTimer = 0;

        let changeDirection = false;

        for (const alien of aliens) {
            if (!alien.alive) continue;

            if (
                (alien.x > W - 65 && alienDirection > 0) ||
                (alien.x < 20 && alienDirection < 0)
            ) {
                changeDirection = true;
                break;
            }
        }

        if (changeDirection) {
            alienDirection *= -1;

            for (const alien of aliens) {
                alien.y += 20;
            }
        } else {
            for (const alien of aliens) {
                alien.x += alienDirection * 15;
            }
        }

        soundAlienStep();
    }

    /* Aliens occasionally fire */

    if (Math.random() < dt * (0.22 + level * 0.04)) {
        const livingAliens = aliens.filter(a => a.alive);

        if (livingAliens.length > 0) {
            const shooter =
                livingAliens[Math.floor(Math.random() * livingAliens.length)];

            alienBullets.push({
                x: shooter.x + shooter.width / 2,
                y: shooter.y + shooter.height,
                width: 6,
                height: 13
            });

            soundEnemyFire();
        }
    }

    /* Alien bullets */

    for (let i = alienBullets.length - 1; i >= 0; i--) {
        const bullet = alienBullets[i];
        bullet.y += (230 + level * 18) * dt;

        if (bullet.y > H) {
            alienBullets.splice(i, 1);
            continue;
        }

        const playerBox = {
            x: player.x - 22,
            y: player.y - 17,
            width: 44,
            height: 34
        };

        if (player.alive && collision(bullet, playerBox)) {
            alienBullets.splice(i, 1);
            loseLife();
        }
    }

    /* Aliens reaching the player */

    for (const alien of aliens) {
        if (alien.alive && alien.y + alien.height > player.y - 25) {
            endGame();
            break;
        }
    }

    /* Update explosions */

    for (let i = explosions.length - 1; i >= 0; i--) {
        explosions[i].age += dt;

        if (explosions[i].age > 0.36) {
            explosions.splice(i, 1);
        }
    }
}

function loseLife() {
    lives--;
    addExplosion(player.x, player.y);
    soundPlayerExplosion();
    updateStats();

    if (lives <= 0) {
        endGame();
    } else {
        player.x = 400;
        alienBullets.length = 0;
    }
}

function endGame() {
    if (gameOver) return;

    gameOver = true;
    running = false;
    soundGameOver();
}

/* --------------------------------------------------
   KEYBOARD CONTROLS
-------------------------------------------------- */

window.addEventListener("keydown", e => {
    if (
        ["ArrowLeft", "ArrowRight", " ", "ArrowUp", "ArrowDown"].includes(e.key)
    ) {
        e.preventDefault();
    }

    if (e.key === "Enter" && (!running || gameOver)) {
        newGame();
        return;
    }

    if (e.key === "p" || e.key === "P") {
        if (running && !gameOver) {
            paused = !paused;
        }
    }

    keys[e.key] = true;

    if (!running && !gameOver && e.key === " ") {
        newGame();
    }
});

window.addEventListener("keyup", e => {
    keys[e.key] = false;
});

window.addEventListener("blur", () => {
    Object.keys(keys).forEach(key => keys[key] = false);
});

/* --------------------------------------------------
   TOUCHSCREEN CONTROLS
-------------------------------------------------- */

function holdButton(id, key) {
    const button = document.getElementById(id);

    button.addEventListener("pointerdown", e => {
        e.preventDefault();

        initAudio();

        if (!running || gameOver) {
            if (key === " ") {
                newGame();
                return;
            }
        }

        keys[key] = true;

        try {
            button.setPointerCapture(e.pointerId);
        } catch (_) {}
    });

    function release(e) {
        keys[key] = false;
    }

    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);
}

holdButton("left", "ArrowLeft");
holdButton("right", "ArrowRight");
holdButton("fire", " ");

document.getElementById("pause").addEventListener("click", () => {
    initAudio();

    if (!running && !gameOver) {
        newGame();
        return;
    }

    if (!gameOver) {
        paused = !paused;
    }
});

/* --------------------------------------------------
   RESPONSIVE CANVAS
   Keep the original 4:3 game proportions on tablets.
-------------------------------------------------- */

function resizeCanvas() {
    const area = document.querySelector(".gamearea");

    const scale = Math.min(
        area.clientWidth / W,
        area.clientHeight / H
    );

    canvas.style.width = (W * scale) + "px";
    canvas.style.height = (H * scale) + "px";
}

new ResizeObserver(resizeCanvas).observe(
    document.querySelector(".gamearea")
);

window.addEventListener("resize", resizeCanvas);

/* --------------------------------------------------
   MAIN GAME LOOP
-------------------------------------------------- */

function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.04);
    lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

/* Initial screen */

createAliens();
resizeCanvas();
draw();

requestAnimationFrame(gameLoop);

/* Start game on first tap of the game area */

canvas.addEventListener("pointerdown", () => {
    initAudio();

    if (!running || gameOver) {
        newGame();
    }
});

</script>
</body>
</html>
