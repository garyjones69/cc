<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Invaders Arcade</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:15px;
 background:#050914;
 color:white;
 font-family:Arial,sans-serif;
 text-align:center;
}

h1{
 color:#48ff9b;
 letter-spacing:5px;
 text-shadow:0 0 12px #48ff9b;
}

.game{
 max-width:650px;
 margin:auto;
}

.stats{
 display:flex;
 justify-content:space-around;
 flex-wrap:wrap;
 gap:10px;
 margin:18px 0;
 color:#48ff9b;
 font-weight:bold;
}

canvas{
 width:100%;
 background:#020711;
 border:2px solid #48ff9b;
 border-radius:8px;
 display:block;
 touch-action:pan-y;
}

.controls{
 display:flex;
 gap:12px;
 margin-top:15px;
}

button{
 border:0;
 border-radius:8px;
 padding:15px;
 font-size:20px;
 font-weight:bold;
 cursor:pointer;
 min-height:52px;
}

.controls button{
 flex:1;
 background:#26344b;
 color:white;
}

#fire{background:#c62828}

#start{
 background:#48ff9b;
 color:#001b0b;
}

#pause{
 background:#35445b;
 color:white;
 margin-top:12px;
}

#message{
 padding:12px;
}

.instructions{
 color:#9eabc0;
 font-size:13px;
}
</style>
</head>

<body>

<div class="game">

<h1>SPACE INVADERS</h1>

<div class="stats">
 <span>SCORE: <span id="score">0</span></span>
 <span>BEST: <span id="best">0</span></span>
 <span>LIVES: <span id="lives">3</span></span>
 <span>LEVEL: <span id="level">1</span></span>
</div>

<canvas id="game" width="600" height="560"></canvas>

<div id="message">
 <h2 id="heading">DEFEND EARTH!</h2>
 <button id="start">START GAME</button>
</div>

<div class="controls">
 <button id="left">◀</button>
 <button id="fire">🔥 FIRE</button>
 <button id="right">▶</button>
</div>

<button id="pause">PAUSE</button>

<p class="instructions">
Keyboard: LEFT / RIGHT / SPACE<br>
Mobile: Use the buttons above
</p>

</div>

<script>

// ========================================
// EMBEDDED SPRITE SHEET
// ========================================

// Four alien types, each with two animation frames.
// Each sprite is 48 x 40 pixels.
// The complete sheet is 192 x 160 pixels.

const svg = `
<svg xmlns="http://www.w3.org/2000/svg"
 width="192" height="160" viewBox="0 0 192 160">

<g fill="#48ff9b">

<!-- ALIEN TYPE 1 FRAME 1 -->
<g transform="translate(0,0)">
 <path d="M16 4 H32 V10 H40 V22 H46 V34 H38 V28 H32 V38 H26 V32 H22 V38 H16 V28 H10 V34 H2 V22 H8 V10 H16 Z"/>
 <rect x="13" y="15" width="6" height="6" fill="#020711"/>
 <rect x="29" y="15" width="6" height="6" fill="#020711"/>
</g>

<!-- ALIEN TYPE 1 FRAME 2 -->
<g transform="translate(48,0)">
 <path d="M16 4 H32 V10 H40 V22 H46 V34 H38 V28 H32 V34 H26 V38 H22 V34 H16 V28 H10 V34 H2 V22 H8 V10 H16 Z"/>
 <rect x="13" y="15" width="6" height="6" fill="#020711"/>
 <rect x="29" y="15" width="6" height="6" fill="#020711"/>
</g>

<!-- ALIEN TYPE 2 FRAME 1 -->
<g transform="translate(96,0)" fill="#ffb84d">
 <path d="M24 3 L29 10 H39 V16 H45 V28 H39 V34 H32 V39 H16 V34 H9 V28 H3 V16 H9 V10 H19 Z"/>
 <rect x="13" y="16" width="7" height="7" fill="#020711"/>
 <rect x="28" y="16" width="7" height="7" fill="#020711"/>
 <rect x="19" y="27" width="10" height="4" fill="#020711"/>
</g>

<!-- ALIEN TYPE 2 FRAME 2 -->
<g transform="translate(144,0)" fill="#ffb84d">
 <path d="M24 3 L29 10 H39 V16 H45 V28 H39 V34 H32 V39 H16 V34 H9 V28 H3 V16 H9 V10 H19 Z"/>
 <rect x="13" y="16" width="7" height="7" fill="#020711"/>
 <rect x="28" y="16" width="7" height="7" fill="#020711"/>
 <path d="M19 27 H29 V31 H19 Z" fill="#020711"/>
 <path d="M5 34 H14 V39 H8 Z M34 34 H43 V39 H37 Z"/>
</g>

<!-- ALIEN TYPE 3 FRAME 1 -->
<g transform="translate(0,40)" fill="#ff65a3">
 <path d="M24 2 L32 10 H40 V18 H46 V29 H40 V35 H32 V39 H16 V35 H8 V29 H2 V18 H8 V10 H16 Z"/>
 <rect x="12" y="16" width="7" height="7" fill="#020711"/>
 <rect x="29" y="16" width="7" height="7" fill="#020711"/>
 <rect x="17" y="27" width="14" height="4" fill="#020711"/>
</g>

<!-- ALIEN TYPE 3 FRAME 2 -->
<g transform="translate(48,40)" fill="#ff65a3">
 <path d="M24 2 L32 10 H40 V18 H46 V29 H40 V35 H32 V39 H16 V35 H8 V29 H2 V18 H8 V10 H16 Z"/>
 <rect x="12" y="16" width="7" height="7" fill="#020711"/>
 <rect x="29" y="16" width="7" height="7" fill="#020711"/>
 <rect x="17" y="27" width="14" height="4" fill="#020711"/>
 <path d="M4 34 H13 V39 H4 Z M35 34 H44 V39 H35 Z"/>
</g>

<!-- ALIEN TYPE 4 FRAME 1 -->
<g transform="translate(96,40)" fill="#6ee7ff">
 <path d="M24 2 L31 9 H38 V15 H45 V28 H38 V35 H30 V39 H18 V35 H10 V28 H3 V15 H10 V9 H17 Z"/>
 <rect x="12" y="16" width="7" height="7" fill="#020711"/>
 <rect x="29" y="16" width="7" height="7" fill="#020711"/>
 <path d="M17 28 H31 V32 H17 Z" fill="#020711"/>
</g>

<!-- ALIEN TYPE 4 FRAME 2 -->
<g transform="translate(144,40)" fill="#6ee7ff">
 <path d="M24 2 L31 9 H38 V15 H45 V28 H38 V35 H30 V39 H18 V35 H10 V28 H3 V15 H10 V9 H17 Z"/>
 <rect x="12" y="16" width="7" height="7" fill="#020711"/>
 <rect x="29" y="16" width="7" height="7" fill="#020711"/>
 <path d="M17 28 H31 V32 H17 Z" fill="#020711"/>
 <path d="M5 34 H13 V39 H5 Z M35 34 H43 V39 H35 Z"/>
</g>

</g>

<!-- SHIP -->
<g transform="translate(0,80)" fill="#48ff9b">
 <path d="M24 0 L34 15 H46 V28 H2 V15 H14 Z"/>
 <rect x="20" y="4" width="8" height="8" fill="#020711"/>
</g>

</svg>`;

// Encode the sprite sheet directly into a Base64 data URI.

const spriteImage = new Image();

spriteImage.src = "data:image/svg+xml;base64," +
 btoa(unescape(encodeURIComponent(svg)));


// ========================================
// GAME SETUP
// ========================================

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const W=600,H=560;

let ship;
let aliens=[];
let shots=[];
let bombs=[];
let shields=[];
let explosions=[];

let score=0;
let best=0;
let lives=3;
let level=1;

let direction=1;
let frame=0;
let running=false;
let paused=false;
let keys={};

const $=id=>document.getElementById(id);


// ========================================
// INITIALISE GAME
// ========================================

function reset(){

 ship={x:300,y:510};

 aliens=[];
 shots=[];
 bombs=[];
 explosions=[];

 shields=[90,245,400,510].map(x=>({
  x,y:440,hp:5
 }));

 for(let r=0;r<4;r++){
  for(let c=0;c<9;c++){

   aliens.push({
    x:65+c*57,
    y:65+r*42,
    row:r,
    alive:true
   });

  }
 }

 score=0;
 lives=3;
 level=1;
 direction=1;
 frame=0;

 updateStats();
}

function updateStats(){

 $("score").textContent=score;
 $("best").textContent=best;
 $("lives").textContent=lives;
 $("level").textContent=level;

}


// ========================================
// DRAW ALIEN SPRITES
// ========================================

function drawAlien(a){

 // Change animation frame every 15 game frames.
 const animationFrame=Math.floor(frame/15)%2;

 // Four different alien designs.
 const alienType=a.row;

 const spriteX=animationFrame*48;
 const spriteY=alienType*40;

 ctx.drawImage(
  spriteImage,

  spriteX,
  spriteY,
  48,
  40,

  a.x-24,
  a.y-20,
  48,
  40
 );

}


// ========================================
// DRAW PLAYER SHIP
// ========================================

function drawShip(){

 // Ship sprite is in the third row of the sprite sheet.

 ctx.drawImage(
  spriteImage,
  0,80,
  48,40,
  ship.x-24,
  ship.y-20,
  48,40
 );

}


// ========================================
// EXPLOSIONS
// ========================================

function createExplosion(x,y){

 explosions.push({
  x,y,
  radius:4,
  life:15
 });

}

function drawExplosions(){

 explosions.forEach(e=>{

  ctx.fillStyle=
   e.life>9?"#ffff66":
   e.life>5?"#ff9933":"#ff3333";

  ctx.globalAlpha=e.life/15;

  ctx.beginPath();
  ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);
  ctx.fill();

  ctx.globalAlpha=1;

 });

 explosions=explosions.filter(e=>{

  e.life--;
  e.radius+=1.5;

  return e.life>0;

 });

}


// ========================================
// DRAW GAME
// ========================================

function draw(){

 ctx.clearRect(0,0,W,H);

 // Stars

 ctx.fillStyle="white";

 for(let i=0;i<75;i++){

  const x=(i*137+31)%W;
  const y=(i*83+13)%H;

  ctx.globalAlpha=.4+(i%3)*.2;
  ctx.fillRect(x,y,2,2);

 }

 ctx.globalAlpha=1;

 // Ground

 ctx.fillStyle="#48ff9b";
 ctx.fillRect(0,540,W,2);

 // Ship

 drawShip();

 // Aliens

 aliens.filter(a=>a.alive).forEach(drawAlien);

 // Shields

 shields.forEach(s=>{

  if(s.hp>0){

   ctx.fillStyle="#48ff9b";
   ctx.globalAlpha=s.hp/5;

   ctx.fillRect(
    s.x-25,s.y-12,50,18
   );

   ctx.globalAlpha=1;

  }

 });

 // Player lasers

 ctx.fillStyle="#ffffff";

 shots.forEach(s=>{
  ctx.fillRect(s.x-2,s.y-9,4,12);
 });

 // Alien bombs

 ctx.fillStyle="#ff5151";

 bombs.forEach(b=>{
  ctx.fillRect(b.x-3,b.y-5,6,11);
 });

 drawExplosions();

}


// ========================================
// PLAYER FIRING
// ========================================

function shoot(){

 if(shots.length<5){

  shots.push({
   x:ship.x,
   y:ship.y-20
  });

 }

}


// ========================================
// GAME UPDATE
// ========================================

function update(){

 frame++;

 // Move ship

 if(keys.left)ship.x-=5;
 if(keys.right)ship.x+=5;

 ship.x=Math.max(25,Math.min(W-25,ship.x));

 // Fire

 if(keys.fire&&frame%12===0){
  shoot();
 }

 // Move alien formation

 let alive=aliens.filter(a=>a.alive);

 let speed=1+level*.25+
  (36-alive.length)*.025;

 let min=600,max=0;

 alive.forEach(a=>{

  a.x+=direction*speed;

  min=Math.min(min,a.x);
  max=Math.max(max,a.x);

 });

 if(max>578||min<22){

  direction*=-1;

  alive.forEach(a=>{
   a.y+=17;
  });

 }

 // Alien firing

 if(frame%Math.max(18,65-level*5)===0&&alive.length){

  const candidates=alive.filter(a=>
   !alive.some(b=>b.x===a.x&&b.y>a.y)
  );

  const a=candidates[
   Math.floor(Math.random()*candidates.length)
  ];

  if(a){
   bombs.push({x:a.x,y:a.y+12});
  }

 }

 // Move player lasers

 shots=shots.filter(s=>{

  s.y-=9;

  if(s.y<=0)return false;

  for(let a of alive){

   if(Math.abs(s.x-a.x)<19&&
      Math.abs(s.y-a.y)<18){

    a.alive=false;

    score+=(4-a.row)*10;

    createExplosion(a.x,a.y);

    updateStats();

    return false;

   }

  }

  for(let sh of shields){

   if(sh.hp>0&&
      Math.abs(s.x-sh.x)<25&&
      Math.abs(s.y-sh.y)<12){

    sh.hp--;
    return false;

   }

  }

  return true;

 });

 // Move alien bombs

 bombs=bombs.filter(b=>{

  b.y+=4+level*.4;

  if(Math.abs(b.x-ship.x)<23&&
     Math.abs(b.y-ship.y)<15){

   lives--;
   updateStats();

   if(lives<=0){
    endGame(false);
   }

   return false;

  }

  for(let sh of shields){

   if(sh.hp>0&&
      Math.abs(b.x-sh.x)<25&&
      Math.abs(b.y-sh.y)<12){

    sh.hp--;
    return false;

   }

  }

  return b.y<H;

 });

 // Aliens reach Earth

 if(alive.some(a=>a.y>475)){
  endGame(false);
 }

 // Next level

 if(alive.length===0){

  level++;

  for(let r=0;r<4;r++){

   for(let c=0;c<9;c++){

    aliens.push({
     x:65+c*57,
     y:65+r*42,
     row:r,
     alive:true
    });

   }

  }

  direction=1;
  bombs=[];

  shields.forEach(s=>{
   s.hp=Math.min(5,s.hp+1);
  });

  updateStats();

 }

}


// ========================================
// GAME LOOP
// ========================================

function loop(){

 if(!running||paused)return;

 update();
 draw();

 if(running){
  requestAnimationFrame(loop);
 }

}


// ========================================
// START / END GAME
// ========================================

function start(){

 reset();

 running=true;
 paused=false;

 $("message").style.display="none";
 $("pause").textContent="PAUSE";

 requestAnimationFrame(loop);

}

function endGame(win){

 running=false;
 $("message").style.display="block";

 $("heading").textContent=
  win?"EARTH SAVED!":"GAME OVER";

 $("start").textContent="PLAY AGAIN";

}


// ========================================
// KEYBOARD CONTROLS
// ========================================

document.addEventListener("keydown",e=>{

 if(["ArrowLeft","ArrowRight"," "].includes(e.key)){
  e.preventDefault();
 }

 if(e.key==="ArrowLeft")keys.left=true;
 if(e.key==="ArrowRight")keys.right=true;
 if(e.key===" ")keys.fire=true;

});

document.addEventListener("keyup",e=>{

 if(e.key==="ArrowLeft")keys.left=false;
 if(e.key==="ArrowRight")keys.right=false;
 if(e.key===" ")keys.fire=false;

});


// ========================================
// MOBILE CONTROLS
// ========================================

function hold(id,key){

 const el=$(id);

 el.addEventListener("pointerdown",e=>{

  e.preventDefault();

  el.setPointerCapture(e.pointerId);

  keys[key]=true;

 });

 ["pointerup","pointercancel","lostpointercapture"]
 .forEach(event=>{

  el.addEventListener(event,()=>{
   keys[key]=false;
  });

 });

}

hold("left","left");
hold("right","right");
hold("fire","fire");


// ========================================
// PAUSE
// ========================================

$("pause").addEventListener("click",()=>{

 if(!running)return;

 paused=!paused;

 $("pause").textContent=
  paused?"RESUME":"PAUSE";

 if(paused){

  $("heading").textContent="PAUSED";
  $("start").textContent="RESUME";

  $("message").style.display="block";

 }else{

  $("message").style.display="none";

  requestAnimationFrame(loop);

 }

});

$("start").addEventListener("click",()=>{

 if(paused&&!gameOver){

  paused=false;

  $("message").style.display="none";
  $("pause").textContent="PAUSE";

  requestAnimationFrame(loop);

 }else{

  start();

 }

});


// ========================================
// INITIALISE
// ========================================

reset();

spriteImage.onload=()=>{

 draw();

};

</script>

</body>
</html>
